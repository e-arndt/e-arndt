name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate development stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: e-arndt
        run: python scripts/generate_profile_stats.py

      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/development-stats.svg; then
            echo "Stats card is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/development-stats.svg
          git commit -m "Update profile development stats"
          git push
