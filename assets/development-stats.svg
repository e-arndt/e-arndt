<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<style>
  .title { font: 700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#f0f6fc; }
  .text { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#c9d1d9; }
  .muted { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#8b949e; }
  .metric { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
</style>
<rect width="100%" height="100%" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="35" y="48" class="title">⚡ Development Stats</text>
<rect x="35" y="105" width="190" height="105" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="245" y="105" width="190" height="105" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="455" y="105" width="190" height="105" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="665" y="105" width="190" height="105" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="53" y="147" class="metric" fill="#58a6ff">—</text><text x="53" y="178" class="muted">CONTRIBUTIONS THIS YEAR</text>
<text x="263" y="147" class="metric" fill="#3fb950">—</text><text x="263" y="178" class="muted">PUBLIC REPOS</text>
<text x="473" y="147" class="metric" fill="#bc8cff">—</text><text x="473" y="178" class="muted">PULL REQUESTS</text>
